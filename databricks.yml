bundle:
  name: trade_analytics

include:
  - resources/*.yml

variables:
  catalog:
    description: >-
      Unity Catalog catalog que contém os schemas bronze/silver/gold.
      Precisa já existir — este bundle cria os SCHEMAS, mas não o CATÁLOGO.
  s3_endpoint:
    description: >-
      Endpoint S3-compatible do seu storage (ex: Supabase Storage:
      https://<projeto>.storage.supabase.co/storage/v1/s3). Sem default de
      propósito — nunca commitado. Defina via
      `databricks bundle deploy --var="s3_endpoint=..."` ou pela variável de
      ambiente `BUNDLE_VAR_s3_endpoint`.
  prod_service_principal_id:
    description: >-
      Application ID do service principal que roda o deploy/job em prod
      (run_as, ver target prod abaixo). Não é secret (é o "usuário", não a
      senha), mas mesmo assim sem default — cada ambiente/fork usa o seu
      próprio SP, não o de quem criou este template. Defina via
      `BUNDLE_VAR_prod_service_principal_id` (na esteira de CI/CD, mesmo
      valor do client_id de autenticação já usado pra rodar o deploy).

targets:
  dev:
    # mode: development NÃO é usado de propósito: ele prefixaria os nomes de
    # recursos (inclusive os schemas UC bronze/silver/gold) com "dev_<user>_",
    # o que quebraria a exigência de nomes exatos deste projeto.
    default: true
    workspace:
      host: https://<SEU_WORKSPACE>.cloud.databricks.com   # ⚠️ TROQUE pelo host do seu workspace (ver README)
    variables:
      catalog: aisleiq_dev

  prod:
    # SP aisleiq_ci — grants já concedidos: USE_CATALOG/CREATE_SCHEMA/
    # USE_SCHEMA/CREATE_TABLE/CREATE_MATERIALIZED_VIEW/SELECT em aisleiq_prod,
    # READ no secret scope 'supabase' (bronze_ingest.py roda como esse SP em
    # prod e precisa ler as credenciais do Supabase em runtime).
    run_as:
      service_principal_name: ${var.prod_service_principal_id}
    mode: production
    workspace:
      host: https://<SEU_WORKSPACE>.cloud.databricks.com   # ⚠️ TROQUE — pode ser um workspace diferente do de dev
      # Fixo (recomendação do próprio `bundle validate` pra mode: production:
      # evita risco de deploy duplicado se mais de uma identidade deployar
      # prod), mas dentro da pasta do SP de run_as — não na raiz do
      # /Workspace/, que só admin escreve (era o "access denied" anterior).
      # userName do SP no workspace == o Application ID (mesma variável).
      root_path: /Workspace/Users/${var.prod_service_principal_id}/.bundle/${bundle.name}/${bundle.target}
    variables:
      # ⚠️ TROQUE se o catálogo de produção tiver outro nome (precisa já existir).
      catalog: aisleiq_prod
    resources:
      jobs:
        trade_analytics:
          schedule:
            pause_status: UNPAUSED
